name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso mtools dosfstools grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: Copy kernel
        run: |
          set +e
          mkdir -p "root project/build"
          KERNEL=$(find /boot -name 'vmlinuz*' -type f 2>/dev/null | head -1)
          if [ -z "$KERNEL" ]; then
            echo "No kernel in /boot, installing..."
            sudo apt-get install -y -qq linux-image-generic
            KERNEL=$(find /boot -name 'vmlinuz*' -type f 2>/dev/null | head -1)
          fi
          echo "KERNEL=$KERNEL"
          cp "$KERNEL" "root project/build/vmlinuz"

      - name: Copy busybox
        run: |
          mkdir -p "root project/scripts/initramfs/bin"
          cp /bin/busybox "root project/scripts/initramfs/bin/" 2>/dev/null || \
          cp /usr/bin/busybox "root project/scripts/initramfs/bin/" 2>/dev/null || \
          (sudo apt-get install -y -qq busybox-static && cp /bin/busybox "root project/scripts/initramfs/bin/")

      - name: Make initramfs
        run: |
          cd "root project/scripts/initramfs"
          find . | cpio -H newc -o | gzip > ../../build/initramfs.cpio.gz

      - name: Build ISO
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo bash scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: servecosys.iso
          path: root project/build/servecosys.iso
          compression-level: 0
          retention-days: 90