name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc make uuid-dev \
            bc kmod cpio openssl \
            bison flex libssl-dev libelf-dev \
            xorriso mtools dosfstools \
            grub-pc-bin grub-efi-amd64-bin grub2-common \
            busybox-static

      - name: Setup kernel & initramfs
        run: |
          cd "root project"
          mkdir -p build

          # Use Ubuntu stock kernel for CI speed
          cp /boot/vmlinuz-$(uname -r) build/vmlinuz

          # Create BusyBox initramfs
          mkdir -p scripts/initramfs/bin
          cp $(which busybox) scripts/initramfs/bin/
          cd scripts/initramfs/bin
          for cmd in sh mount mkdir cat ls cp mv rm modprobe insmod dmesg grep cut sed echo sleep switch_root; do
            ln -sf busybox $cmd 2>/dev/null || true
          done
          cd "$GITHUB_WORKSPACE/root project"
          chmod +x scripts/initramfs/init
          cd scripts/initramfs
          find . | cpio -H newc -o | gzip > "$GITHUB_WORKSPACE/root project/build/initramfs.cpio.gz"

      - name: Create GRUB boot config
        run: |
          mkdir -p "root project/boot/grub"
          cat > "root project/boot/grub/grub.cfg" << 'EOF'
set default=0
set timeout=5

menuentry "ServEcosys Root Project" {
    linux /boot/vmlinuz console=ttyS0 console=tty0
    initrd /boot/initramfs.cpio.gz
}
EOF

      - name: Generate signing keys
        run: |
          cd "root project"
          mkdir -p scripts/keys
          openssl genrsa -out scripts/keys/maintainer.key 4096 2>/dev/null
          openssl req -new -key scripts/keys/maintainer.key \
            -out scripts/keys/maintainer.csr \
            -subj "/CN=ServEcosys" 2>/dev/null
          openssl x509 -req -days 365 -in scripts/keys/maintainer.csr \
            -signkey scripts/keys/maintainer.key \
            -out scripts/keys/maintainer.crt 2>/dev/null
          openssl dgst -sha256 -sign scripts/keys/maintainer.key \
            -out build/vmlinuz.sig build/vmlinuz

      - name: Build ISO
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo ./scripts/build_image.sh -o build/servecosys.iso \
            -k build/vmlinuz \
            -i build/initramfs.cpio.gz

      - name: Get version
        id: version
        run: echo "tag=v0.1.0-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ServEcosys ${{ steps.version.outputs.tag }}"
          body: |
            ## ServEcosys Root Project ${{ steps.version.outputs.tag }}

            ### 下载 servecosys.iso
            - UEFI 可启动 (GRUB)
            - Linux 内核 (Ubuntu 22.04 stock)
            - BusyBox initramfs
          files: root project/build/servecosys.iso
          make_latest: true
          fail_on_unmatched_files: false
