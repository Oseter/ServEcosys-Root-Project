name: CI - ConceptOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-conceptos
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conceptos
          path: |
            root project/build/ConceptOS.iso
            root project/build/vmlinuz
            root project/build/initramfs.cpio.gz
          compression-level: 0
          retention-days: 30