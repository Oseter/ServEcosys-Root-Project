name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools dosfstools grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: Prepare kernel & initramfs
        run: |
          cd "root project"
          mkdir -p build
          cp /boot/vmlinuz-$(uname -r) build/vmlinuz
          mkdir -p scripts/initramfs/bin
          cp $(which busybox) scripts/initramfs/bin/
          cd scripts/initramfs/bin
          for cmd in sh mount mkdir cat ls cp mv rm modprobe insmod dmesg grep cut sed echo sleep switch_root; do
            ln -sf busybox $cmd 2>/dev/null || true
          done
          cd "$GITHUB_WORKSPACE/root project"
          chmod +x scripts/initramfs/init
          cd scripts/initramfs
          find . | cpio -H newc -o | gzip > "$GITHUB_WORKSPACE/root project/build/initramfs.cpio.gz"

      - name: Build ISO
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo ./scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: servecosys.iso
          path: root project/build/servecosys.iso
          compression-level: 0
          retention-days: 90