name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso mtools dosfstools grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: Prepare kernel & initramfs
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/root project"
          mkdir -p build
          cp /boot/vmlinuz-* build/vmlinuz
          mkdir -p scripts/initramfs/bin
          cp $(which busybox) scripts/initramfs/bin/
          cd scripts/initramfs
          find . | cpio -H newc -o | gzip > "$GITHUB_WORKSPACE/root project/build/initramfs.cpio.gz"
          echo "initramfs done"

      - name: Build ISO
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/root project"
          chmod +x scripts/build_image.sh
          sudo bash scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: servecosys.iso
          path: root project/build/servecosys.iso
          compression-level: 0
          retention-days: 90