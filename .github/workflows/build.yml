name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso mtools dosfstools grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: Get kernel
        run: |
          mkdir -p "root project/build"
          KFILE=$(ls /boot/vmlinuz-* 2>/dev/null | head -1) || true
          if [ -z "$KFILE" ]; then
            sudo apt-get install -y -qq linux-image-generic
            KFILE=$(ls /boot/vmlinuz-* | head -1) || true
          fi
          cp "$KFILE" "root project/build/vmlinuz"
          ls -la "root project/build/vmlinuz"

      - name: Initramfs
        run: |
          mkdir -p "root project/scripts/initramfs/bin"
          BB=$(which busybox) || true
          if [ -z "$BB" ]; then
            sudo apt-get install -y -qq busybox-static
            BB=$(which busybox) || true
          fi
          cp "$BB" "root project/scripts/initramfs/bin/"
          chmod +x "root project/scripts/initramfs/init" 2>/dev/null || true
          cd "root project/scripts/initramfs"
          find . -type f | cpio -H newc -o 2>/dev/null | gzip > ../../build/initramfs.cpio.gz || true
          ls -la ../../build/initramfs.cpio.gz

      - name: Build ISO
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo bash scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz
          ls -la build/servecosys.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: servecosys.iso
          path: root project/build/servecosys.iso
          compression-level: 0
          retention-days: 90