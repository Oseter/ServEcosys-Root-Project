name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso mtools dosfstools grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: Debug boot
        run: |
          echo "=== /boot/ ==="
          ls -la /boot/ || echo "no boot"
          echo "=== uname ==="
          uname -r
          echo "=== find ==="
          find /boot -type f 2>/dev/null || echo "no files"
          echo "=== GITHUB_WORKSPACE ==="
          echo "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/" || echo "no workspace"

      - name: Prepare kernel
        run: |
          mkdir -p "root project/build"
          INSTALLED=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          if [ -n "$INSTALLED" ]; then
            cp "$INSTALLED" "root project/build/vmlinuz"
            echo "Kernel: $INSTALLED"
          else
            echo "No kernel found, installing linux-image-generic..."
            sudo apt-get install -y -qq linux-image-generic
            KFILE=$(ls /boot/vmlinuz-* | head -1)
            cp "$KFILE" "root project/build/vmlinuz"
            echo "Kernel: $KFILE"
          fi
          ls -la "root project/build/vmlinuz"

      - name: Prepare initramfs
        run: |
          mkdir -p "root project/scripts/initramfs/bin"
          cp /bin/busybox "root project/scripts/initramfs/bin/"
          chmod +x "root project/scripts/initramfs/init"
          cd "root project/scripts/initramfs"
          find . | cpio -H newc -o | gzip > "$GITHUB_WORKSPACE/root project/build/initramfs.cpio.gz"
          ls -la "$GITHUB_WORKSPACE/root project/build/initramfs.cpio.gz"

      - name: Build ISO
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo bash scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: servecosys.iso
          path: root project/build/servecosys.iso
          compression-level: 0
          retention-days: 90