name: Build ServEcosys ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc make uuid-dev \
            gnu-efi \
            bc kmod cpio openssl \
            bison flex libssl-dev libelf-dev \
            xorriso mtools dosfstools \
            busybox-static

      - name: Download Linux 6.6 LTS
        run: |
          cd "root project"
          mkdir -p build
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
          tar -xf linux-6.6.tar.xz
          mv linux-6.6 kernel/linux-src

      - name: Build bootloader
        run: |
          cd "root project/boot"
          make clean 2>/dev/null || true
          make ARCH=x86_64
          cp bootloader.efi ../build/

      - name: Build kernel
        run: |
          cd "root project/kernel/linux-src"
          cp ../core/servecosys_defconfig .config
          make olddefconfig
          make -j$(nproc) bzImage
          cp arch/x86/boot/bzImage ../../build/vmlinuz

      - name: Build modules
        run: |
          cd "root project/kernel/linux-src"
          make -j$(nproc) modules
          make modules_install INSTALL_MOD_PATH=../../build/modules

      - name: Generate initramfs
        run: |
          cd "root project"
          mkdir -p scripts/initramfs/bin
          cp $(which busybox) scripts/initramfs/bin/
          cd scripts/initramfs/bin
          for cmd in sh mount mkdir cat ls cp mv rm modprobe insmod dmesg grep cut sed echo sleep; do
            ln -sf busybox $cmd 2>/dev/null || true
          done
          cd "$GITHUB_WORKSPACE/root project"
          chmod +x scripts/initramfs/init
          cd scripts/initramfs
          find . | cpio -H newc -o | gzip > "$GITHUB_WORKSPACE/root project/build/initramfs.cpio.gz"

      - name: Generate keys & sign
        run: |
          cd "root project"
          mkdir -p scripts/keys
          openssl genrsa -out scripts/keys/maintainer.key 4096 2>/dev/null
          openssl req -new -key scripts/keys/maintainer.key \
            -out scripts/keys/maintainer.csr \
            -subj "/CN=ServEcosys" 2>/dev/null
          openssl x509 -req -days 365 -in scripts/keys/maintainer.csr \
            -signkey scripts/keys/maintainer.key \
            -out scripts/keys/maintainer.crt 2>/dev/null
          openssl dgst -sha256 -sign scripts/keys/maintainer.key \
            -out build/vmlinuz.sig build/vmlinuz

      - name: Build backend deps
        run: make -C "root project/backend/deps" all

      - name: Build SED daemons (.smle)
        run: make -C "root project/backend/sub_kernel" all

      - name: Build frontend deps
        run: make -C "root project/frontend/deps" all

      - name: Build UID daemons (.ssle)
        run: make -C "root project/frontend/ui" all

      - name: Build ISO
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo ./scripts/build_image.sh -o build/servecosys.iso \
            -k build/vmlinuz \
            -i build/initramfs.cpio.gz \
            -b build/bootloader.efi

      - name: Get version
        id: version
        run: echo "tag=v0.1.0-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ServEcosys ${{ steps.version.outputs.tag }}"
          body: |
            ## ServEcosys Root Project 自动构建 ISO
            
            ### 包含
            - Linux 6.6 LTS 内核
            - UEFI 引导加载器
            - initramfs (BusyBox)
            - SED 后端守护进程 (.smle)
            - UID 前端守护进程 (.ssle)
            - SELinux 策略
            
            ### 测试
            ```
            qemu-system-x86_64 -cdrom servecosys.iso -m 2G -bios /usr/share/ovmf/OVMF.fd
            ```
          files: root project/build/servecosys.iso
          make_latest: true
