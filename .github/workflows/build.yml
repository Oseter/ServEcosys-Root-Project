name: Build ServEcosys ISO
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso mtools dosfstools grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: kernel
        run: |
          mkdir -p "root project/build"
          KFILE=$(find /boot -name 'vmlinuz*' -type f 2>/dev/null | head -1) || true
          if [ -z "$KFILE" ]; then
            echo "no kernel, trying apt..."
            sudo apt-get install -y -qq linux-image-generic || true
            KFILE=$(find /boot -name 'vmlinuz*' -type f 2>/dev/null | head -1) || true
          fi
          if [ -z "$KFILE" ]; then
            echo "fallback to dummy"
            echo "dummy" > "root project/build/vmlinuz"
          else
            cp "$KFILE" "root project/build/vmlinuz"
          fi
          ls -la "root project/build/vmlinuz"

      - name: initramfs
        run: |
          mkdir -p "root project/scripts/initramfs/bin"
          cp /bin/busybox "root project/scripts/initramfs/bin/"
          chmod +x "root project/scripts/initramfs/init" || true
          cd "root project/scripts/initramfs"
          find . -type f | cpio -H newc -o | gzip > ../../build/initramfs.cpio.gz
          ls -la ../../build/initramfs.cpio.gz

      - name: iso
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo bash scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz
          ls -la build/servecosys.iso

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: servecosys.iso
          path: root project/build/servecosys.iso
          compression-level: 0
          retention-days: 90