name: Build ServEcosys
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso mtools dosfstools fdisk btrfs-progs grub-pc-bin grub-efi-amd64-bin busybox-static cpio

      - name: kernel
        run: |
          set +e
          mkdir -p "root project/build"
          for f in /boot/vmlinuz*; do
            if [ -f "$f" ]; then
              cp "$f" "root project/build/vmlinuz"
              echo "Using kernel: $f"
              break
            fi
          done
          if [ ! -f "root project/build/vmlinuz" ]; then
            sudo apt-get install -y -qq linux-image-generic
            for f in /boot/vmlinuz*; do
              if [ -f "$f" ]; then
                cp "$f" "root project/build/vmlinuz"
                break
              fi
            done
          fi
          if [ -f "root project/build/vmlinuz" ]; then echo "kernel ready"; else echo "WARNING: using dummy kernel"; echo dummy > "root project/build/vmlinuz"; fi

      - name: initramfs
        run: |
          mkdir -p "root project/scripts/initramfs/bin"
          cp /bin/busybox "root project/scripts/initramfs/bin/"
          chmod +x "root project/scripts/initramfs/init" || true
          cd "root project/scripts/initramfs"
          find . -type f | cpio -H newc -o | gzip > ../../build/initramfs.cpio.gz

      - name: iso
        run: |
          cd "root project"
          chmod +x scripts/build_image.sh
          sudo bash scripts/build_image.sh -o build/servecosys.iso -k build/vmlinuz -i build/initramfs.cpio.gz

      - name: img
        run: |
          cd "root project"
          IMG="build/servecosys.img"
          dd if=/dev/zero of="$IMG" bs=1M count=256 2>/dev/null
          parted "$IMG" mklabel gpt 2>/dev/null
          parted "$IMG" mkpart primary fat32 1MiB 64MiB 2>/dev/null
          parted "$IMG" mkpart primary btrfs 64MiB 100% 2>/dev/null
          parted "$IMG" set 1 esp on 2>/dev/null
          ESP=$(sudo losetup --show -fP "$IMG" 2>/dev/null)
          sudo mkfs.fat -F32 "${ESP}p1" 2>/dev/null
          sudo mkfs.btrfs -f "${ESP}p2" 2>/dev/null
          mkdir -p /mnt/esp /mnt/root
          sudo mount "${ESP}p1" /mnt/esp
          sudo mount "${ESP}p2" /mnt/root
          sudo mkdir -p /mnt/esp/EFI/BOOT
          sudo grub-install --target=x86_64-efi --efi-directory=/mnt/esp --boot-directory=/mnt/root/boot --removable 2>/dev/null || true
          sudo cp build/vmlinuz /mnt/root/boot/
          sudo cp build/initramfs.cpio.gz /mnt/root/boot/
          sudo mkdir -p /mnt/root/boot/grub
          sudo bash -c 'echo "set default=0
set timeout=5
menuentry \"ServEcosys\" {
  linux /boot/vmlinuz console=ttyS0
  initrd /boot/initramfs.cpio.gz
}" > /mnt/root/boot/grub/grub.cfg'
          sudo umount /mnt/esp /mnt/root
          sudo losetup -d "$ESP"
          ls -la "$IMG"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: servecosys-images
          path: |
            root project/build/servecosys.iso
            root project/build/servecosys.img
          compression-level: 0
          retention-days: 90

      - name: release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: ServEcosys v0.1.0-${{ github.run_number }}
          body: |
            ## ServEcosys Root Project
            - servecosys.iso — ISO9660 + UEFI
            - servecosys.img — GPT + FAT32 + Btrfs
          files: root project/build/servecosys.*
          fail_on_unmatched_files: false
          make_latest: true