# 概念OS (ConceptOS) - GRUB2 引导菜单
# 同时用于 ISO (grub-mkrescue) 与可安装磁盘镜像 ConceptOS.img (ESP)
#
# 引导逻辑:
#   - 标准: 内核 + initramfs (initramfs 自动探测 Btrfs 真实根或退回 live模式)
#   - 详细日志: 同上但 loglevel=7 (排障)
#   - initramfs 定位 /boot/vmlinuz + /boot/initramfs.cpio.gz (同目录布局)
#
# 视机器固件: BIOS 与 UEFI 均可用 (grub-mkrescue / grub-install 自动注入)

set default="0"
set timeout="5"

# 若支持图形终端则用之（否则回退 console 串行 + VGA）
if loadfont unicode ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
else
    set terminfo=console
fi

menuentry "概念OS (ConceptOS) - 标准启动" {
    search --no-floppy --set=root --file /boot/vmlinuz
    linux   /boot/vmlinuz console=ttyS0,115200n8 console=tty0 loglevel=7 rdinit=/init break=none
    initrd  /boot/initramfs.cpio.gz
}

menuentry "概念OS (ConceptOS) - 详细日志 (排障)" {
    search --no-floppy --set=root --file /boot/vmlinuz
    linux   /boot/vmlinuz console=ttyS0,115200n8 console=tty0 loglevel=7 earlyprintk=serial rdinit=/init break=none
    initrd  /boot/initramfs.cpio.gz
}

menuentry "概念OS (ConceptOS) - 内存检测 (memtest)" {
    echo "未内置 memtest86；可从 pxe/光盘 手工加载。"
}

menuentry "重启" {
    reboot
}

menuentry "关机" {
    halt
}